name: pages

# site/ 의 정적 소개 페이지를 GitHub Pages 로 배포한다.
# https://proofer-tech.github.io/context-protocol/

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 키보드 밖 특수문자 검사
        run: |
          if grep -nP '[\x{2014}\x{2013}\x{2192}\x{2190}\x{2026}\x{00B7}\x{2018}\x{2019}\x{201C}\x{201D}]' site/*; then
            echo "키보드 밖 특수문자가 있다" >&2; exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
