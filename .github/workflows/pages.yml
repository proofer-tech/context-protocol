name: pages

# site/ 의 정적 소개 페이지를 GitHub Pages 로 배포한다.
# https://proofer-tech.github.io/context-protocol/
# 업로드와 배포를 한 잡에 두면 배포 단계가 방금 올린 artifact 를 목록에서 못 찾는 일이 잦아서
# (Found 0 artifact(s)) 공식 템플릿처럼 build 와 deploy 잡으로 나눈다.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "site-src/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 키보드 밖 특수문자 검사
        run: |
          if grep -nP '[\x{2014}\x{2013}\x{2192}\x{2190}\x{2026}\x{00B7}\x{2018}\x{2019}\x{201C}\x{201D}]' site/*.html site/*.txt site/*.css site-src/src/*; then
            echo "키보드 밖 특수문자가 있다" >&2; exit 1
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
