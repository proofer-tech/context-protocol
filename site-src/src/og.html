<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>

.og .r svg{position:absolute;inset:40px 40px 40px 0;width:340px;height:550px}

.og .f{display:flex;align-items:center;gap:16px;font-size:26px;font-weight:700}
.og .f img{height:30px;width:auto}
.og .f span{color:#5b6172;font-weight:400;font-size:22px}
.og .mk{position:absolute;left:72px;top:70px;width:180px;height:180px;border-radius:40px;background:#344fe0;box-shadow:0 10px 22px -10px rgba(52,79,224,.85);display:grid;place-items:center}

  </div>
